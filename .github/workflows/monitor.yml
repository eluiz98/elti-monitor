name: Certificados

# Desde 07/11/2026 o "está no ar" de 15 em 15 min roda no Cloudflare Worker (worker/), porque o
# agendamento do GitHub atrasava ~6 h. Aqui fica a validade dos certificados (>= 14 dias) e o HTTPS
# de cada host, a cada 6 h. Se falhar, o próprio GitHub manda e-mail de "workflow failed".
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: bash monitor.sh hosts.txt
